name: analytics-service CI

on:
  pull_request:
    branches: [main, t3]
  push:
    branches: [main, t3]

permissions:
  contents: read
  security-events: write

env:
  SERVICE_NAME: analytics-service
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  GITOPS_REPO: jobucaldas/3DCLT-TC
  GITOPS_BRANCH: t3

jobs:
  ci:
    name: Test, scan and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: python -m pytest

      - name: Lint
        run: flake8 .

      - name: SCA dependency scan
        continue-on-error: true
        run: pip-audit -r requirements.txt

      - name: SAST with bandit
        run: bandit -r . -x ./tests -lll

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker build
        run: docker build -t ${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Push image to ECR
        if: github.event_name == 'push'
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        run: |
          if aws ecr describe-images --repository-name ${{ env.SERVICE_NAME }} --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "tag exists, skip push"
          else
            docker tag ${{ env.SERVICE_NAME }}:${{ github.sha }} "$IMAGE_URI"
            docker push "$IMAGE_URI"
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Update GitOps image tag
        if: github.event_name == 'push'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install yq
        if: github.event_name == 'push'
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Commit GitOps image tag
        if: github.event_name == 'push'
        working-directory: gitops
        run: |
          yq -i '(.spec.template.spec.containers[] | select(.name == env(SERVICE_NAME)) | .image) = env(IMAGE_URI)' k8s/app/${{ env.SERVICE_NAME }}/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app/${{ env.SERVICE_NAME }}/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(gitops): update ${{ env.SERVICE_NAME }} image to ${{ github.sha }}"
          git push origin HEAD:${{ env.GITOPS_BRANCH }}
